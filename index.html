<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pontaj">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pontaj Dispecerat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" id="fav" type="image/png" href="favicon-64.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!--
    Rama aplicației „Pontaj Dispecerat” (CNFR Navrom S.A. · Suc. Constanța · Biroul Dispecerat).
    Deschide aplicația Google Apps Script pe tot ecranul, fără banner-ul Google, și afișează
    numărul de propuneri noi (doar pentru administrator):
      - în titlul filei: „(2) Pontaj Dispecerat”;
      - pe favicon, cu o bulină roșie;
      - pe iconița aplicației instalate (setAppBadge), unde sistemul permite.
    Rama nu conține date și nu vede datele: primește de la aplicație doar un număr (postMessage)
    și acceptă mesaje numai din propriul cadru, venite de pe *.googleusercontent.com.

    ► SINGURA SETARE: APP_URL = linkul /exec (Apps Script → Implementare → Gestionează implementările).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #1B2A4A; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0f1117; }
    #help { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 3;
      max-width: 560px; margin: 0 auto; padding: 12px 14px; border-radius: 14px; background: #fff; color: #1B2A4A;
      font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
    #help p { margin: 0 0 10px; }
    #help .row { display: flex; gap: 8px; flex-wrap: wrap; }
    #help button, #help a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px;
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    #help button { border: 0; background: #1B2A4A; color: #fff; }
    #help a { border: 1px solid #1B2A4A; color: #1B2A4A; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <iframe id="app" title="Pontaj Dispecerat"
          allow="clipboard-read; clipboard-write; web-share; fullscreen"></iframe>
  <div id="help" role="alert" hidden>
    <p>Aplicația se încarcă greu sau Google a afișat o eroare.</p>
    <div class="row">
      <button type="button" id="help-retry">Reîncearcă</button>
      <a id="help-open" target="_blank" rel="noopener">Deschide direct</a>
    </div>
  </div>
  <noscript><p style="color:#fff;padding:24px">Aplicația are nevoie de JavaScript activat.</p></noscript>
<script>
(function () {
  'use strict';
  // ► Adresa aplicației (linkul /exec). Înlocuiește cu linkul implementării tale:
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwRvTMf_vOEZznSNTNNmP4JGZg0zmRX6CrtEGdeG6zeXZTRJHEUOEdxoeNWwH3IARbPcQ/exec';

  // Linkul copiat din bara browserului poate conține contul Google („/macros/u/1/s/…”): îl curățăm.
  APP_URL = APP_URL.replace(/\/macros\/u\/\d+\/s\//, '/macros/s/');

  var TITLE = 'Pontaj Dispecerat';
  var GOOGLE = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;   // originea cadrului Apps Script
  var frame = document.getElementById('app');
  frame.src = APP_URL;

  /* ── cifra: titlu, favicon, iconița aplicației instalate ── */
  var base = new Image(), count = 0, linked = false, lastPing = 0;
  base.src = 'favicon-64.png';
  function favicon(n) {
    var link = document.getElementById('fav');
    if (!n) { link.href = 'favicon-64.png'; return; }
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d');
    if (base.complete && base.naturalWidth) g.drawImage(base, 0, 0, 64, 64);
    var txt = n > 99 ? '99+' : String(n);
    var r = txt.length > 2 ? 22 : 19;
    g.beginPath(); g.arc(64 - r + 2, r - 2, r, 0, Math.PI * 2); g.fillStyle = '#E5372B'; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#FFFFFF'; g.stroke();
    g.fillStyle = '#FFFFFF'; g.font = 'bold ' + (txt.length > 2 ? 18 : 24) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 64 - r + 2, r - 1);
    link.href = c.toDataURL('image/png');
  }
  function show(n) {
    count = n;
    document.title = n ? '(' + (n > 99 ? '99+' : n) + ') ' + TITLE : TITLE;
    favicon(n);
    try {
      if ('setAppBadge' in navigator) {
        if (n) navigator.setAppBadge(n).catch(function () {}); else navigator.clearAppBadge().catch(function () {});
      }
    } catch (e) { /* fără cifră pe iconița aplicației */ }
  }
  base.onload = function () { if (count) favicon(count); };

  /* ── Service Worker: necesar pentru instalare pe unele sisteme; nu memorează nimic ── */
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) { console.warn('Service Worker: ' + e); });
  }

  /* ── mesajele aplicației: doar din cadrul nostru (oricât de adânc în cadrele Google) ── */
  function fromOurFrame(src) {
    var w = src;
    for (var i = 0; i < 6 && w; i++) {
      if (w === frame.contentWindow) return true;
      try { if (w === w.parent) return false; w = w.parent; } catch (e) { return false; }
    }
    return false;
  }
  window.addEventListener('message', function (e) {
    if (!GOOGLE.test(e.origin) || !e.data || !fromOurFrame(e.source)) return;
    var d = e.data;
    if (d.tip === 'pontaj-nr') {
      var n = Number(d.n);
      if (!(n >= 0 && n < 100000 && Math.floor(n) === n)) return;
      linked = true;
      help.hidden = true; clearTimeout(helpTimer);
      show(n);
    }
  });

  /* ── „salutul”: aplicația (adânc în cadrele Google) află că rulează în ramă ── */
  function ping(w, depth) {
    try { w.postMessage({ tip: 'pontaj-rama-salut' }, '*'); } catch (e) { /* cadru indisponibil */ }
    if (depth >= 4) return;
    try { for (var i = 0; i < w.frames.length; i++) ping(w.frames[i], depth + 1); } catch (e) { /* cadru indisponibil */ }
  }
  // des la început (până răspunde aplicația), apoi rar: aplicația se poate reîncărca în cadru (ieșire / intrare în cont)
  setInterval(function () {
    var now = Date.now();
    if (!linked || now - lastPing > 20000) { ping(frame.contentWindow, 0); lastPing = now; }
  }, 1500);
  frame.addEventListener('load', function () { linked = false; });

  /* ── plasă de siguranță: dacă aplicația nu răspunde în 20 s, oferim reîncercarea ── */
  var help = document.getElementById('help');
  document.getElementById('help-open').href = APP_URL;
  document.getElementById('help-retry').addEventListener('click', function () { help.hidden = true; frame.src = APP_URL; armHelp(); });
  var helpTimer = null;
  function armHelp() { clearTimeout(helpTimer); helpTimer = setTimeout(function () { if (!linked) help.hidden = false; }, 20000); }
  armHelp();
})();
</script>
</body>
</html>
